name: Build ACMECertManager

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8 (exact version)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Publish single .exe (fixed syntax)
      run: dotnet publish src/ACMECertManager.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ACMECertManager-exe
        path: publish/ACMECertManager.exe
