name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - .github/workflows/**
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 10 (minimum required)
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Debug

    - name: Test
      run: dotnet test --no-build -c Debug

  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 10 (minimum required)
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test tests/ACMECertManager.Tests/ACMECertManager.Tests.csproj -c Debug

