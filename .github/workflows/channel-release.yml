name: Channel Release

permissions:
  contents: write

on:
  push:
    branches:
      - develop
      - release/**
    paths:
      - src/**
      - .github/workflows/**

jobs:
  compute-version:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Compute channel version
      id: version
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const fs = require('fs');
          const branch = context.ref.replace('refs/heads/', '');
          const channel = branch === 'develop' ? 'alpha' : (branch.startsWith('release/') ? 'rc' : 'alpha');

          const csproj = fs.readFileSync('src/ACMECertManager.csproj', 'utf8');
          const match = csproj.match(/<VersionPrefix>([^<]+)<\/VersionPrefix>/i);
          if (!match) {
            core.setFailed('VersionPrefix was not found in src/ACMECertManager.csproj');
            return;
          }

          const baseVersion = match[1].trim();
          const version = `${baseVersion}-${channel}.${context.runNumber}.${context.runAttempt}`;
          const tag = `v${version}`;
          const numericBase = baseVersion.split('.');
          const fileVersion = `${numericBase[0]}.${numericBase[1]}.${numericBase[2]}.${context.runNumber}`;
          const releaseName = `${baseVersion} ${channel.toUpperCase()} (${branch})`;

          core.info(`Computed channel tag: ${tag}`);
          core.setOutput('tag', tag);
          core.setOutput('version', version);
          core.setOutput('file_version', fileVersion);
          core.setOutput('release_name', releaseName);
          core.setOutput('channel', channel);

  build-packages:
    needs: compute-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64, win-arm64]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: "10.0.x"

    - name: Restore
      run: dotnet restore

    - name: Publish single .exe
      run: >
        dotnet publish src/ACMECertManager.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -p:Version=${{ needs.compute-version.outputs.version }}
        -p:FileVersion=${{ needs.compute-version.outputs.file_version }}
        -p:AssemblyVersion=${{ needs.compute-version.outputs.file_version }}
        -p:InformationalVersion=${{ needs.compute-version.outputs.tag }}
        -o publish/${{ matrix.rid }}

    - name: Prepare package structure
      shell: pwsh
      run: |
        $packageRoot = "package/ACMECertManager"
        New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
        Copy-Item -Path "publish/${{ matrix.rid }}/*" -Destination $packageRoot -Recurse -Force
        New-Item -ItemType Directory -Force -Path "$packageRoot/plugins" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/logs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/certs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/storage" | Out-Null
        if (Test-Path "$packageRoot/acm.pdb") {
          Remove-Item "$packageRoot/acm.pdb" -Force
        }

    - name: Create zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        $zipName = "ACMECertManager-${{ needs.compute-version.outputs.tag }}-${{ matrix.rid }}.zip"
        Compress-Archive -Path "package/*" -DestinationPath "dist/$zipName" -Force

    - name: Upload package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: channel-release-${{ matrix.rid }}
        path: dist/*.zip

  publish-release:
    needs: [compute-version, build-packages]
    runs-on: windows-latest
    steps:
    - name: Download packaged archives
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: channel-release-*
        merge-multiple: true
        path: dist

    - name: Publish channel release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        tag_name: ${{ needs.compute-version.outputs.tag }}
        name: ${{ needs.compute-version.outputs.release_name }}
        prerelease: true
        generate_release_notes: true
        files: dist/*.zip
        fail_on_unmatched_files: true
