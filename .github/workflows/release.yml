name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
    - name: Validate SemVer tag
      id: parse
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
          throw "Tag '$tag' is invalid. Use vMAJOR.MINOR.PATCH (example: v1.0.0)."
        }

        $version = $tag.Substring(1)
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-packages:
    needs: validate-tag
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64, win-arm64]
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Restore
      run: dotnet restore

    - name: Publish single .exe
      run: >
        dotnet publish src/ACMECertManager.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -p:Version=${{ needs.validate-tag.outputs.version }}
        -p:FileVersion=${{ needs.validate-tag.outputs.version }}.0
        -p:AssemblyVersion=${{ needs.validate-tag.outputs.version }}.0
        -p:InformationalVersion=${{ needs.validate-tag.outputs.version }}
        -o publish/${{ matrix.rid }}

    - name: Prepare package structure
      shell: pwsh
      run: |
        $packageRoot = "package/ACMECertManager"
        New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
        Copy-Item -Path "publish/${{ matrix.rid }}/*" -Destination $packageRoot -Recurse -Force
        New-Item -ItemType Directory -Force -Path "$packageRoot/plugins" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/logs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/certs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$packageRoot/storage" | Out-Null
        if (Test-Path "$packageRoot/acm.pdb") {
          Remove-Item "$packageRoot/acm.pdb" -Force
        }

    - name: Create zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        $zipName = "ACMECertManager-${{ needs.validate-tag.outputs.tag }}-${{ matrix.rid }}.zip"
        Compress-Archive -Path "package/*" -DestinationPath "dist/$zipName" -Force

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.rid }}
        path: dist/*.zip

  publish-release:
    needs: [validate-tag, build-packages]
    runs-on: windows-latest
    steps:
    - name: Download packaged archives
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: dist

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        tag_name: ${{ needs.validate-tag.outputs.tag }}
        generate_release_notes: true
        files: dist/*.zip
        fail_on_unmatched_files: true
